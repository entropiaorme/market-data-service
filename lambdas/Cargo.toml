[workspace]
resolver = "2"
members = ["contracts", "ingest", "aggregate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
contracts = { path = "contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"
time = { version = "0.3", features = ["parsing", "formatting", "serde", "macros"] }
tokio = { version = "1", features = ["macros"] }
lambda_http = "0.13"
lambda_runtime = "0.13"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
